name: Gerar APK e Publicar

on:
  push:
    branches: [ "main" ]

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar codigo do repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm install

      - name: Compilar o projeto web (Build)
        run: npm run build

      - name: Configurar ambiente Android (Java)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Adicionar plataforma Android com Capacitor
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Gerar icones do aplicativo a partir de assets/icon.png
        run: |
          if [ -f "assets/icon.png" ]; then
            npx @capacitor/assets generate --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#0f172a' --android --assetPath assets
          fi

      - name: Gerar o APK de instalacao
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
          cp app/build/outputs/apk/debug/app-debug.apk ../app-conexao-viva-viver-com-proposito.apk

      - name: Publicar APK nos Releases
        uses: softprops/action-gh-release@v1
        with:
          files: app-conexao-viva-viver-com-proposito.apk
          tag_name: v1.0.${{ github.run_number }}
          name: Versão Automática ${{ github.run_number }}
          body: "APK gerado automaticamente pelo GitHub Actions para teste e instalação direta."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
